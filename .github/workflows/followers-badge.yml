name: Update Followers Badge

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/followers-badge.yml"
      - "scripts/update-followers-badge.mjs"

permissions:
  contents: write

jobs:
  update-followers-badge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate followers badge
        run: node scripts/update-followers-badge.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit badge updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-followers.svg
          if git diff --cached --quiet; then
            echo "No badge changes to commit."
            exit 0
          fi
          git commit -m "chore: update followers badge"
          git push
